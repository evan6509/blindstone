plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'com.evanchubbuck.blindstone'
base { archivesName = 'blindstone' }

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        blindstone { sourceSet sourceSets.main }
        blindstone_tests { sourceSet sourceSets.gametest }
    }
    runs {
        smoke {
            server()
            name 'Blindstone normal private-alpha server'
            source sourceSets.main
            runDir 'build/smoke'
        }
        gametest {
            server()
            name 'Blindstone isolated integration tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dblindstone.development=true'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
    }
}

tasks.named('runSmoke') { standardInput = System.in }
