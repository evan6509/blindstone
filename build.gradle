plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'com.evanchubbuck.blindstone'
base { archivesName = 'blindstone' }

repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java {
    withSourcesJar()
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

sourceSets {
    admission {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        blindstone { sourceSet sourceSets.main }
        blindstone_tests { sourceSet sourceSets.gametest }
    }
    runs {
        smoke {
            server()
            name 'Blindstone normal private-alpha server'
            source sourceSets.main
            runDir 'build/smoke'
        }
        gametest {
            server()
            name 'Blindstone isolated integration tests'
            source sourceSets.gametest
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dblindstone.development=true'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get()}/gametest-results.xml"
            runDir 'build/gametest'
        }
    }
}

tasks.named('runSmoke') { standardInput = System.in }

// The driver uses a separately installed production JAR. These utilities never enter that JAR.
tasks.register('prepareAdmission', JavaExec) {
    dependsOn tasks.named('build'), tasks.named('admissionClasses')
    classpath = sourceSets.admission.runtimeClasspath
    workingDir = layout.buildDirectory.get().asFile
    mainClass = 'com.evanchubbuck.blindstone.admission.AdmissionMetadata'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    args layout.buildDirectory.file('admission-metadata.json').get().asFile.absolutePath
    doLast {
        def libraries = sourceSets.main.runtimeClasspath.files.findAll {
            it.name.endsWith('.jar') && !it.path.contains('net.fabricmc.fabric-api') && !it.name.startsWith('minecraft-')
        }
        def serverJar = new File(gradle.gradleUserHomeDir, 'caches/fabric-loom/26.3/minecraft-extracted_server.jar')
        if (!serverJar.isFile()) throw new GradleException('Pinned extracted production server JAR is missing')
        def api = configurations.runtimeClasspath.files.find { it.name == "fabric-api-${project.fabric_version}.jar" }
        if (api == null) throw new GradleException('Pinned Fabric API umbrella JAR is missing')
        def launch = [java: javaLauncher.get().executablePath.asFile.absolutePath,
            classpath: (libraries + serverJar).collect { it.absolutePath }.join(File.pathSeparator),
            serverJar: serverJar.absolutePath, fabricApi: api.absolutePath,
            artifact: tasks.jar.archiveFile.get().asFile.absolutePath]
        layout.buildDirectory.file('admission-launch.json').get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch)) + '\n'
    }
}
